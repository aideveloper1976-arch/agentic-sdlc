name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component
      description: Which server, agent, command or plugin?
      placeholder: e.g. security-mcp, /run-full-sdlc, model router
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, config (with secrets removed) and output.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Node version, OpenCode version
